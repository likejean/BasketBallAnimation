<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" type="text/css" href="Styling.css">
		<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"></script>
		<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>
		<script src="node_modules/svg.js/dist/svg.js"></script>
		<script src="node_modules/svg.draw.js/dist/svg.draw.js"></script>		  
	</head>
	<body onload = "the_timer = setInterval(set_timer, increment_t)">
	<H1>My Ball Animation</H1>
	<svg id="frame" viewBox="0 0 2000 1000">		
		<defs>			
			<filter id ="image">
				<feImage xlink:href="Basketball.png"/>
			</filter>
			<filter id ="f2" x="0" y="0" width="105" height="105">
				<feOffset result="offOut" in="SourceGraphic" dx="10" dy="0" />
				<feColorMatrix result = "matrixOut" in = "offOut" type = "matrix" values = "0.2 0 0 0 0 0 0.2 0 0 0 0 0 0.2 0 0 0 0 0 1 0"/>
				<feGaussianBlur result="blurOut" in="matrixOut" stdDeviation="3" />
				<feBlend in="SourceGraphic" in2="blurOut" mode="normal" />
			</filter>			
		</defs>			
		<g filter="url(#f2)">
			<circle id = "circle" cx="150" cy="80" r="50" stroke="green" stroke-width="2" style="filter:url(#image)";>
				<animateTransform 
				id = "trans"
				attributeName="transform"
				attributeType="XML"
				type="rotate"
				from="0 150 80"
				to="360 150 80"
				dur="1s"
				repeatCount="indefinite"/> 
			</circle>
		</g>
		<defs>
			<pattern id="img1" patternUnits="userSpaceOnUse" width="100%" height="105%">
				<image class='wall' xlink:href="bricks.jpg" x="0" y="0"
					width="503.57" height="1100" />
			</pattern>		
		</defs>		  
		<rect id = "wall" x="0" y="200" width="472.27" height="1075" stroke="none" fill="url(#img1)"></rect>
		<line x1="500" y1="555" x2="1500" y2="555" style="stroke:black; stroke-width:10"></line>
	</svg><br>
	<button type="button" class="btn btn-danger" onclick = clearTimeout(the_timer)>STOP</button>
	<button type="button" class="btn btn-success" onclick = 'the_timer = setInterval(set_timer, increment_t)'>RESUME</button>
	<div class="ramp-control">
		<label for="ramp-frequency">Ramp swing frequency <output id="ramp-frequency-value">0.64 Hz</output></label>
		<input id="ramp-frequency" class="custom-range" type="range" min="0" max="2" step="0.01" value="0.64">
	</div>
	<div class="ramp-control">
		<label for="ramp-amplitude">Ramp swing amplitude <output id="ramp-amplitude-value">2.86°</output></label>
		<input id="ramp-amplitude" class="custom-range" type="range" min="0" max="45" step="0.01" value="2.86">
	</div>
	<script>
		//Initialization Variables
		var position_vec = {x:500, y:75};
		var velocity_vec = {x:200, y:0};
		var angular_position = {prev:0, next:0};
		var _time = {x:0, y:0};
		var ramp_center = {x:1000, y:555};
		var ramp_half_length = 500;
		var ramp_angle = 0;
		var ramp_amplitude = Math.atan(50 / 1000);
		var ramp_phase = 0;
		var ramp_frequency = 0.64;
		var _direction = {x:"right", y:"down"};		
		var increment_t = 5,
		delta = increment_t/500, 
		circle, line, slope, trans, duration = 0, 
		radius, the_timer, leftwall, brickbase,
		count = 0;		
		var wall;		
	
		//Calculation functions
		var vel_y = (t) => 188.81 * t + velocity_vec.y;
		var pos_y = (t) => 188.81 * Math.pow(t,2) / 2 + velocity_vec.y * t + position_vec.y;
		var vel_x = (t) => velocity_vec.x;
		var pos_x = (t) => velocity_vec.x * t + position_vec.x;
		var slope = () => (line.y2.animVal.value - line.y1.animVal.value)/
		(line.x2.animVal.value - line.x1.animVal.value);
		var correction = () => Math.tan(angle()*Math.PI/180)*Math.cos(angle()*Math.PI/180)*circle.r.animVal.value;
		var impact = () => slope() * (circle.cx.animVal.value - line.x1.animVal.value) + line.y1.animVal.value;
		var angle = () => Math.atan(slope())*180/Math.PI;
		var rotation = (v,t) => Math.round(v / radius * t * 2 * 360 / 20);
		function update_ramp_geometry(){
			var half_width = ramp_half_length * Math.cos(ramp_angle);
			var half_height = ramp_half_length * Math.sin(ramp_angle);
			line.setAttribute("x1", ramp_center.x - half_width);
			line.setAttribute("y1", ramp_center.y - half_height);
			line.setAttribute("x2", ramp_center.x + half_width);
			line.setAttribute("y2", ramp_center.y + half_height);
		}
		function resolve_wall_collision(){
			const x = pos_x(_time.x);
			const y = pos_y(_time.y);
			const left = wall.x.baseVal.value;
			const right = left + wall.width.baseVal.value;
			const top = wall.y.baseVal.value;
			const bottom = top + wall.height.baseVal.value;
			const closestX = Math.max(left, Math.min(x, right));
			const closestY = Math.max(top, Math.min(y, bottom));
			const dx = x - closestX;
			const dy = y - closestY;
			const distance = Math.hypot(dx, dy);
			let normalX, normalY, penetration;

			if (distance > Number(radius)){
				return false;
			}

			if (distance > 0){
				normalX = dx / distance;
				normalY = dy / distance;
				penetration = Number(radius) - distance;
			}else{
				const edges = [
					{distance: x - left, x: -1, y: 0},
					{distance: right - x, x: 1, y: 0},
					{distance: y - top, x: 0, y: -1},
					{distance: bottom - y, x: 0, y: 1}
				].sort((a, b) => a.distance - b.distance);
				normalX = edges[0].x;
				normalY = edges[0].y;
				penetration = Number(radius) + edges[0].distance;
			}

			const velocityX = vel_x(_time.x);
			const velocityY = vel_y(_time.y);
			const normalVelocity = velocityX * normalX + velocityY * normalY;
			if (normalVelocity >= 0){
				return false;
			}

			position_vec.x = x + normalX * penetration;
			position_vec.y = y + normalY * penetration;
			velocity_vec.x = velocityX - 2 * normalVelocity * normalX;
			velocity_vec.y = velocityY - 2 * normalVelocity * normalY;
			_time.x = 0;
			_time.y = 0;
			return true;
		}
		function resolve_canvas_collision(){
			const x = pos_x(_time.x);
			const y = pos_y(_time.y);
			const minX = Number(radius);
			const maxX = 2000 - Number(radius);
			const minY = Number(radius);
			const maxY = 1000 - Number(radius);
			const velocityX = vel_x(_time.x);
			const velocityY = vel_y(_time.y);

			if (x < minX && velocityX < 0){
				position_vec.x = minX;
				velocity_vec.x = -velocityX;
				_direction.x = "right";
				_time.x = 0;
			}else if (x > maxX && velocityX > 0){
				position_vec.x = maxX;
				velocity_vec.x = -velocityX;
				_direction.x = "left";
				_time.x = 0;
			}

			if (y < minY && velocityY < 0){
				position_vec.y = minY;
				velocity_vec.y = -velocityY;
				_direction.y = "down";
				_time.y = 0;
			}else if (y > maxY && velocityY > 0){
				position_vec.y = maxY;
				velocity_vec.y = -velocityY;
				_direction.y = "up";
				_time.y = 0;
			}
		}
		//The main function to run this game...
		function set_timer(){
			circle = document.getElementsByTagName("circle")[0];
			line = document.getElementsByTagName("line")[0];
			trans = document.getElementById("trans");
			radius = document.getElementsByTagName("circle")[0].getAttribute("r");
			wall = document.getElementById("wall");
			ramp_phase = (ramp_phase + 2 * Math.PI * ramp_frequency * delta) % (2 * Math.PI);
			ramp_angle = ramp_amplitude * Math.sin(ramp_phase);
			update_ramp_geometry();
			// console.log(wall);
			
			(circle.cy.animVal.value > 200) ? leftwall = 500 : leftwall = 35;				
			const rampLeft = Math.min(line.x1.animVal.value, line.x2.animVal.value);
			const rampRight = Math.max(line.x1.animVal.value, line.x2.animVal.value);
			const overlapsRamp = circle.cx.animVal.value >= rampLeft - Number(radius) &&
				circle.cx.animVal.value <= rampRight + Number(radius);
			brickbase = overlapsRamp ? impact() - correction() - 48 : Infinity;
			
			if (circle.cy.animVal.value > brickbase && _direction.y === "down" && count === 1){
				_direction.y = "up";				
				var vel_obj, before, after, shift, sign = 1;				
				before = pos_x(_time.x);
				position_vec.y = pos_y(_time.y);
				if (vel_x(_time.x)<0){
					var sign = -1;				
				}
				vel_obj = board_deflect (vel_x(_time.x), vel_y(_time.y));				
				velocity_vec.x = sign * vel_obj[0];
				after = pos_x(_time.x);
				shift = after - before;
				position_vec.x -= shift;
				velocity_vec.y = -vel_obj[1];
				angular_position.prev = angular_position.next;
				angular_position.next = rotation(_time.y, velocity_vec.x)	
				
				if (velocity_vec.y >= 0){
				 	velocity_vec.y = -velocity_vec.y;				 	
				 	_direction.y = "down";	
				}
				
						
				_time.y = 0;
				count++;
								
			}else{
				if (circle.cx.animVal.value < leftwall && _direction.x === "left"){
					_direction.x = "right";					 
					position_vec.x = pos_x(_time.x);				
					velocity_vec.x = -vel_x(_time.x);
					angular_position.prev = angular_position.next;
					angular_position.next = rotation(_time.x, velocity_vec.y)/5;																					
					_time.x = 0;					
				}
				else if (circle.cx.animVal.value < leftwall && _direction.x === "right"){
					_direction.x = "left";
					position_vec.x = pos_x(_time.x);				
					velocity_vec.x = -vel_x(_time.x);
					angular_position.prev = angular_position.next;
					angular_position.next = rotation(_time.x, velocity_vec.y)/5;															
					_time.x = 0;					
				}
							
				if (vel_y(_time.y) <= 0){
					_direction.y = "down";				
				}
				
			}
			
			count = 1;
			_time.x += delta;
			_time.y += delta;
			resolve_wall_collision();
			resolve_canvas_collision();

			

			circle.setAttribute("cx", pos_x(_time.x));
			circle.setAttribute("cy", pos_y(_time.y));
			
			trans.setAttribute("from", angular_position.prev + " " + pos_x(_time.x) + " " + pos_y(_time.y));			
			trans.setAttribute("to", angular_position.prev + angular_position.next + " " + pos_x(_time.x) + " " + pos_y(_time.y));
			
										
		}
		function board_deflect (x,y){
			let ang, magnitude;
			magnitude = Math.sqrt(Math.pow(x,2) + Math.pow(y,2));			
			ang = Math.atan(y/x) * 180 / Math.PI;	
			x_prime = Math.cos((ang - angle()) * Math.PI / 180) * magnitude;		
			y_prime = Math.sin((ang - angle()) * Math.PI / 180) * magnitude;			
			return [x_prime, y_prime];
		}

	//This function will be activated later to allow user change angular position of the ball ramp...

		var ramp_frequency_control = document.getElementById("ramp-frequency");
		var ramp_frequency_value = document.getElementById("ramp-frequency-value");
		ramp_frequency_control.addEventListener("input", function(){
			ramp_frequency = Number(this.value);
			ramp_frequency_value.value = ramp_frequency.toFixed(2) + " Hz";
			ramp_frequency_value.textContent = ramp_frequency_value.value;
		});
		var ramp_amplitude_control = document.getElementById("ramp-amplitude");
		var ramp_amplitude_value = document.getElementById("ramp-amplitude-value");
		ramp_amplitude_control.addEventListener("input", function(){
			var amplitude_degrees = Math.min(45, Math.max(0, Number(this.value)));
			ramp_amplitude = amplitude_degrees * Math.PI / 180;
			ramp_amplitude_value.value = amplitude_degrees.toFixed(2) + "°";
			ramp_amplitude_value.textContent = ramp_amplitude_value.value;
		});

		document.onkeydown = (e) => {
			if (e.keyCode === 37){
				ramp_phase = 3 * Math.PI / 2;
				ramp_angle = -ramp_amplitude;
				update_ramp_geometry();
			}
			if (e.keyCode === 39){
				ramp_phase = Math.PI / 2;
				ramp_angle = ramp_amplitude;
				update_ramp_geometry();
			}
			if (e.keyCode === 40){
				ramp_phase = 0;
				ramp_angle = 0;
				update_ramp_geometry();
			}
		};			
		</script>		
	</body>	
</html>
